name: Planilha → dados do site
on:
  push:
    paths: ["planilha/**.xlsx", "data/**.json", "assets/**", "src/**", "tools/**"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install openpyxl==3.1.5
      - run: python tools/build_data.py
      - run: python tools/build_site.py
      - name: Commit dos arquivos gerados
        run: |
          git config user.name "guia-bot"
          git config user.email "guia-bot@users.noreply.github.com"
          git add data/*.json index.html sw.js
          git diff --cached --quiet || git commit -m "build: planilha → index.html [skip ci]"
          git push
