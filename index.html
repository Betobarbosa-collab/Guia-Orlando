a, tênis, bolsa, perfume e casa de marca com preço baixo. Dezenas de lojas em Orlando e Miami; a de Lincoln Road (South Beach) é enorme.","Remarcações saem na terça à noite → **quarta de manhã** é o melhor dia para achar preço novo baixo. Terça é o dia do desconto 55+.","A etiqueta amarela/vermelha pequena mostra o preço riscado e o novo. Não tem loja online: o desconto é só presencial.","Devolução: 30 dias com nota e etiqueta.","**dd's DISCOUNTS** é a irmã mais barata da Ross (menos lojas; tem em Orlando e Kissimmee)."]},{"id":"t-j-maxx","n":"T.J. Maxx","tag":"Segunda 10% (55+, só Flórida)","tagc":"sun","q":"T.J. Maxx","perto":"380 S State Rd 434, Altamonte Springs","d":["Etiquetas: **branca** = preço normal da loja · **vermelha** = liquidação · **amarela** = preço final (não cai mais; leve na hora).","Melhor dia: quarta de manhã (novidades e remarcações). Janeiro e julho têm liquidação geral.","Forte em bolsas, cosméticos de marca, roupa fitness e casa. Lojas **Runway** (maiores) têm grifes."]},{"id":"marshalls","n":"Marshalls","tag":"Mesma rede da T.J. Maxx","tagc":"sky","q":"Marshalls","perto":"995 FL-434, Altamonte Springs","d":["Mesmas cores de etiqueta (amarela = preço final). Mais roupa masculina, juvenil e sapatos que a T.J. Maxx.","Pergunte pelo desconto de segunda 55+: não é oficial em todas, mas algumas lojas da Flórida dão.","Chegue na abertura (9h30): as araras de clearance ficam no fundo e nas pontas de corredor."]},{"id":"homegoods","n":"HomeGoods","tag":"Só casa e cozinha","tagc":"sky","q":"HomeGoods","d":["Irmã da T.J. Maxx só com casa: panelas, cama, banho, decoração, mala de viagem. Mesmas etiquetas (amarela = final).","Bom lugar para comprar mala extra barata para trazer as compras."]},{"id":"burlington","n":"Burlington","tag":"Casacos, malas, bebê","tagc":"sky","q":"Burlington","perto":"130 E Altamonte Dr, Altamonte Springs","d":["Famosa por casacos (coats), malas, enxoval de bebê e perfumes com desconto.","Clearance fica em prateleiras no fundo ou nas pontas de corredor; sticker colorido = remarcado.","Sem desconto por idade; vale comparar com a Ross ao lado."]},{"id":"nordstrom-rack","n":"Nordstrom Rack","tag":"Grifes com desconto","tagc":"sky","q":"Nordstrom Rack","perto":"1090 N Orlando Ave, Winter Park","d":["Outlet da Nordstrom: roupa, sapato e bolsa de marca por até 70% menos.","Etiqueta **vermelha** = clearance; em eventos \"Clear the Rack\" tem 25% extra sobre a vermelha.","Guarde a nota: devolução costuma ser aceita por várias semanas."]},{"id":"saks-off-5th","n":"Saks OFF 5TH","tag":"Luxo com desconto","tagc":"sky","q":"Saks OFF 5TH","d":["Outlet da Saks: Michael Kors, Kate Spade, Hugo Boss, perfumes importados. Em Orlando fica no Vineland Premium Outlets; em Miami, no Sawgrass Mills e no Dolphin Mall.","Procure os cartazes \"extra 30–50% off clearance\" (desconto extra em cima da etiqueta)."]},{"id":"macy-s-backstage","n":"Macy's Backstage","tag":"Dentro da Macy's","tagc":"sky","q":"Macy's","d":["Seção de preço baixo dentro de várias lojas Macy's (Florida Mall, Dadeland). Pergunte: _\"Where is Backstage?\"_","A Macy's normal tem araras de clearance com etiqueta amarela e cupons no app (cadastro grátis)."]},{"id":"bealls","n":"bealls","tag":"15% (50+) um dia por semana","tagc":"sun","q":"bealls","perto":"157 FL-436, Fern Park","d":["Rede da Flórida (antiga Bealls Outlet / Burkes Outlet): roupa de praia, verão, calçado e casa, bem barato.","Desconto de 15% para 50+ num dia da semana (segunda na maioria; algumas, terça). Pergunte no caixa qual é o dia.","Cadastro gratuito no programa de pontos (MORE Rewards) só com e-mail."]},{"id":"kohl-s","n":"Kohl's","tag":"Quarta 15% (60+)","tagc":"sun","q":"Kohl's","perto":"945 W State Rd 436, Altamonte Springs","d":["Loja de departamento: roupa, cama, cozinha, tênis, brinquedos. Quarta: 15% para 60+ — peça no caixa.","Cupons do app somam com o desconto; \"Kohl's Cash\" é crédito para gastar dias depois.","Araras de clearance no fundo com etiqueta amarela."]},{"id":"macy-s-jcpenney-dillard-s-belk","n":"Macy's · JCPenney · Dillard's · Belk","tag":"Lojas de departamento","tagc":"sky","q":"Macy's","d":["**Macy's (Florida Mall, Millenia, Altamonte Mall):** leve o passaporte e peça o **desconto de visitante** no balcão de atendimento (\"Visitor Savings Pass\", costuma ser 10%). Macy's Backstage é a seção de preço baixo dentro da loja.","Ficam dentro dos shoppings. Vale ir direto nas araras **Clearance** (etiqueta vermelha/amarela), onde o desconto chega a 70–80%.","JCPenney: cupom de 10–30% no app. Belk: alguns dias de desconto para 60+ na terça — pergunte.","Lençóis, toalhas e panelas costumam ser muito mais baratos que no Brasil."]},{"id":"primark","n":"Primark","tag":"Roupa muito barata","tagc":"sky","q":"Primark","d":["Roupa básica a partir de US$ 3–10, estilo Renner/C&A. Em Orlando: Florida Mall. Em Miami: Sawgrass Mills e Dadeland.","Não aceita devolução sem nota; prove antes."]}]},{"grupo":"Mercado, farmácia e utilidades","itens":[{"id":"walmart","n":"Walmart","tag":"Escaneie no app","tagc":"leaf","q":"Walmart Supercenter","perto":"200 S State Rd 434, Altamonte Springs (unidade pequena)","d":["**Truque do app:** baixe o app Walmart, toque no scanner e aponte para o código de barras. Se o preço do app for menor que o da prateleira, mostre no caixa: _\"Can you match the Walmart.com price?\"_ Vale para item idêntico e em estoque no site.","O scanner revela \"liquidação escondida\": produto mais barato no sistema do que na etiqueta.","Walmart NÃO iguala preço de Target/Amazon (só o próprio site). Não aceita cartão por aproximação: insira o chip.","Aceita gift card Walmart (Banco Inter). Os **Supercenters** (maiores) ficam em Kissimmee, Sanford, Winter Garden, OBT; têm mercado completo, farmácia e roupa."]},{"id":"target","n":"Target","tag":"App Target Circle","tagc":"leaf","q":"Target","perto":"886 W State Rd 436, Altamonte Springs","d":["Conta grátis no app **Target Circle** (só e-mail): ofertas extras no app e no caixa com o código da carteira.","Escaneie o produto no app: se o preço do Target.com for menor, peça para igualar no caixa ou no Guest Services. Desde jan/2026 as ofertas Circle somam com a igualação.","Target não iguala mais Walmart/Amazon (desde jul/2025). Se o preço cair em até 14 dias, leve a nota e peça a diferença.","Clearance nas pontas de corredor com etiqueta vermelha (30/50/70% no canto). Aceita gift card Target (Inter)."]},{"id":"best-buy","n":"Best Buy","tag":"Eletrônicos · iguala preço","tagc":"leaf","q":"Best Buy","d":["Único grande varejista que ainda **iguala preço de concorrentes** (Amazon, Walmart, Target, Costco…): mostre o preço no celular antes de pagar.","Produtos \"Open-Box\" (caixa aberta, devolvido) saem 10–30% mais baratos com garantia.","Atenção à voltagem (110 V) e à garantia, que vale só nos EUA."]},{"id":"five-below","n":"Five Below","tag":"Quase tudo até US$ 5","tagc":"leaf","q":"Five Below","d":["Presentes, capinhas, fones, doces, maquiagem, brinquedos, decoração: quase tudo entre US$ 1 e 5 (alguns até US$ 10).","Ótimo para lembrancinhas em quantidade."]},{"id":"dollar-tree","n":"Dollar Tree","tag":"Tudo a partir de US$ 1,25","tagc":"leaf","q":"Dollar Tree","perto":"945 W State Rd 436, Altamonte Springs","d":["Sacolas de presente, papel, itens de cozinha, doces, produtos de limpeza por US$ 1,25–5.","Tem em toda esquina de Orlando e Miami."]},{"id":"ollie-s-bargain-outlet","n":"Ollie's Bargain Outlet","tag":"Ponta de estoque","tagc":"sky","q":"Ollie's Bargain Outlet","d":["Loja de sobras de estoque (\"Good stuff cheap\"): tapetes, panelas, livros, brinquedos, ferramentas até 70% mais baratos. Bagunçada, mas tem achados.","Cadastro grátis \"Ollie's Army\" dá 10–15% em dias especiais."]},{"id":"walgreens","n":"Walgreens","tag":"1ª terça do mês 20% (55+)","tagc":"sun","q":"Walgreens","perto":"200 W State Rd 436, Altamonte Springs","d":["Cadastro grátis **myWalgreens** no app (e-mail + telefone). Sem ele, a maioria dos preços promocionais não vale.","No app, toque em \"Clip\" nos cupons antes de pagar; no caixa, informe o telefone ou mostre o QR.","Seniors Day: 1ª terça do mês, 20% em itens de preço normal (remédios, vitaminas, cosméticos, chocolates). Aceita gift card Walgreens (Inter)."]},{"id":"cvs-pharmacy","n":"CVS Pharmacy","tag":"ExtraCare + quiosque","tagc":"leaf","q":"CVS Pharmacy","perto":"277 W State Rd 436, Altamonte Springs","d":["Cadastro grátis **ExtraCare** no app. Dá cupons e \"ExtraBucks\" (crédito para a próxima compra).","**Quiosque vermelho** perto da entrada: escaneie o QR do app e ele imprime cupons na hora.","Vitaminas, remédios sem receita e cosméticos costumam ter 2 por 1 (BOGO). Aceita gift card CVS (Inter)."]},{"id":"publix-aldi-trader-joe-s","n":"Publix · Aldi · Trader Joe's","tag":"Mercado","tagc":"leaf","q":"Publix","perto":"482 E Altamonte Dr, Altamonte Springs","d":["**Publix**: toda semana dezenas de itens **BOGO** (leve 2 pague 1) com cartaz amarelo; sanduíche \"Pub Sub\" barato para almoço; cadastro Club Publix grátis.","**Aldi**: mercado mais barato da região; leve sacola e uma moeda de 25 centavos para o carrinho.","**Trader Joe's** (Winter Park, Orlando, Miami): snacks, chocolates, molhos e temperos que dão ótimos presentes."]}]},{"grupo":"Beleza, criança e esporte","itens":[{"id":"ulta-beauty-sephora","n":"Ulta Beauty · Sephora","tag":"Cadastro grátis dá pontos","tagc":"leaf","q":"Ulta Beauty","perto":"375 E Altamonte Dr, Altamonte Springs","d":["Cadastro grátis (e-mail) dá pontos e amostras. Ulta tem cupom de 20% com frequência e marcas de farmácia + luxo juntas.","Perfumes e maquiagem de marca saem mais baratos ainda na T.J. Maxx, Marshalls e Ross (originais)."]},{"id":"bath-body-works","n":"Bath & Body Works","tag":"Cupons no app","tagc":"leaf","q":"Bath & Body Works","d":["Sabonetes, cremes, velas e aromatizadores. No app aparecem cupons tipo \"US$ 10 off US$ 30\"; promoções \"buy 3 get 3\".","Liquidação semestral em janeiro e junho (até 75%)."]},{"id":"carter-s-oshkosh-the-children-s-place","n":"Carter's · OshKosh · The Children's Place","tag":"Roupa de criança","tagc":"leaf","q":"Carter's","d":["Roupa infantil muito barata, principalmente nos outlets. Cadastro grátis no app dá cupom extra de 20–25%.","Tamanhos por idade (2T, 3T, 4, 5…) — veja a tabela na aba Lista."]},{"id":"old-navy-gap-factory","n":"Old Navy · Gap Factory","tag":"Básicos baratos","tagc":"sky","q":"Old Navy","d":["Camisetas, jeans, pijamas e roupa de criança. Clearance no fundo com desconto extra.","App Old Navy dá \"Super Cash\" (crédito para a próxima compra)."]},{"id":"nike-adidas-new-balance-asics-skechers-outlets","n":"Nike · adidas · New Balance · ASICS · Skechers (outlets)","tag":"Tênis","tagc":"sky","q":"Nike Factory Store","d":["Nos outlets. Procure a **parede de clearance** no fundo (cartazes \"extra 20–30% off\"). Nike app: cadastro grátis dá desconto de membro.","Tênis de corrida e caminhada costumam custar metade do preço do Brasil. Skechers é ótima para pés sensíveis.","**Nike Clearance Store** (The Loop West, Kissimmee) é a loja só de sobras da Nike: preço mais baixo que o outlet. **Dick's Sporting Goods** e **Bass Pro Shops** (I-Drive) para esporte, camping e pesca.","**Truque do tamanho infantil:** quem calça até 38 no Brasil cabe na seção **Big Kids / Grade School (GS)**, com os mesmos modelos mais baratos. Veja a tabela \"Tênis na ala infantil\" na aba Lista.","New Balance, ASICS, Puma e Reebok também têm loja nos Premium Outlets: confira o mapa na entrada ou no app Simon. Para modelo específico, veja a lista de pedidos da loja (aparece ao abrir)."]},{"id":"disney-s-character-warehouse","n":"Disney's Character Warehouse","tag":"Produto Disney com desconto","tagc":"sun","q":"Disney's Character Warehouse","d":["Outlet oficial da Disney: canecas, camisetas, pelúcias e orelhas por 50–75% menos que nos parques. Fica nos dois Premium Outlets (International Drive e Vineland).","O estoque muda todo dia: vá cedo.","**Atenção:** desde fev/2026 **toda venda é final** — não aceita troca nem devolução. Confira tamanho e defeitos antes de pagar. A unidade do Sawgrass Mills (Miami) fechou em 2026; só existem as duas de Orlando."]},{"id":"michaels-hobby-lobby","n":"Michaels · Hobby Lobby","tag":"Michaels: 10% todo dia (55+)","tagc":"sun","q":"Michaels","d":["Artesanato, scrapbook, decoração de festa e de Natal. **Michaels dá 10% todo dia para 55+**, inclusive em promoção — peça no caixa.","Hobby Lobby: tudo de decoração de casa com cupons semanais de 40% em um item (no app)."]},{"id":"macrobaby-enxoval-de-bebe","n":"MacroBaby (enxoval de bebê)","tag":"Atendimento em português","tagc":"sky","q":"MacroBaby Orlando","d":["Loja gigante de enxoval perto do Florida Mall, preferida dos brasileiros, com vendedores que falam português. Carrinhos, cadeirinhas, mamadeiras, roupinhas.","Antes de fechar, compare o preço com Target, Walmart e Carter's/OshKosh dos outlets — muitas vezes sai mais barato lá."]},{"id":"lembrancinhas-e-souvenirs","n":"Lembrancinhas e souvenirs","tag":"Onde compensa","tagc":"leaf","q":"World of Disney Disney Springs","d":["**Barato:** produto oficial Disney/Universal na Target, no Walmart e no Character Warehouse (outlets) sai bem mais barato que dentro dos parques.","**Para passear:** Disney Springs tem a **World of Disney** (maior loja Disney), LEGO Store, Coca-Cola Store, Days of Christmas (Natal o ano todo), M&M'S e a Galactic Outpost (Star Wars). Preço cheio, mas vale o passeio.","**Harry Potter:** varinhas (Ollivanders), doces (Honeydukes) e Weasleys só existem dentro dos parques da Universal — se quiser, compre na hora.","**Evite** as lojas de souvenir enormes e chamativas da I-Drive e da US-192: qualidade duvidosa e preço alto. Para lembrancinha em quantidade: Five Below e Dollar Tree."]},{"id":"goodwill-brecho","n":"Goodwill (brechó)","tag":"Brechó de caridade","tagc":"sky","q":"Goodwill","d":["Roupa e objetos usados, muito baratos e organizados. Algumas unidades dão 10–30% para 55+ num dia da semana (varia) — pergunte.","Bom para achar jeans, livros e louça por US$ 2–5."]},{"id":"sunglass-hut-oakley-vault-oculos","n":"Sunglass Hut · Oakley Vault (óculos)","tag":"Óculos de sol","tagc":"sky","q":"Oakley Vault","d":["**Oakley Vault** é o outlet da Oakley: fica nos dois Premium Outlets (International Drive e Vineland), com modelos de coleções passadas 30–50% mais baratos.","**Sunglass Hut** (shoppings e outlets) vende Oakley, Ray-Ban, Persol e outras marcas; costuma ter promoção progressiva (2º par com desconto) — pergunte: _\"Any promotion on a second pair?\"_","Leve a referência do modelo (número que começa com OO/PO) e mostre ao vendedor: a mesma armação tem várias cores.","No Brasil os mesmos óculos custam de 5 a 8 vezes mais; guarde a nota para a alfândega."]}]}],"lugares":[{"grupo":"Regiões de Orlando (para organizar os dias)","itens":[{"id":"altamonte-springs-winter-park-maitland-sua-base","n":"Altamonte Springs · Winter Park · Maitland (sua base)","tag":"Norte","tagc":"sky","d":["Lojas de desconto concentradas na **SR-436** (Altamonte Dr) e **SR-434**: Ross, Burlington, T.J. Maxx, Marshalls, Target, Walmart, Kohl's, bealls — tudo a 5–10 min de carro.","**Altamonte Mall** (451 E Altamonte Dr): shopping fechado com Macy's, JCPenney, Dillard's, Bath & Body Works, Apple.","**Winter Park** (15 min): Park Avenue é uma rua charmosa para passear, cafés e o Nordstrom Rack. Feira aos sábados de manhã.","Estação **SunRail** de Altamonte Springs leva ao centro de Orlando em ~25 min (dias úteis)."]},{"id":"international-drive-i-drive","n":"International Drive (I-Drive)","tag":"Outlets + atrações","tagc":"sun","d":["Avenida turística com o **Orlando International Premium Outlets** (ponta norte), **ICON Park** (roda-gigante, museus, restaurantes), Pointe Orlando e dezenas de lojas de lembrancinha.","**I-Ride Trolley** (ônibus turístico) liga os dois Premium Outlets passando por SeaWorld: tarifa US$ 2; **65+ paga US$ 0,25**. Passa a cada ~20 min.","Perto do Universal (CityWalk é grátis para entrar à noite)."]},{"id":"lake-buena-vista-disney-springs","n":"Lake Buena Vista · Disney Springs","tag":"Disney","tagc":"sun","d":["**Disney Springs**: entrada e estacionamento grátis. World of Disney (maior loja Disney), LEGO, Uniqlo, restaurantes, shows de rua. Ótimo passeio sem ingresso.","Na mesma região: **Orlando Vineland Premium Outlets** e **Lake Buena Vista Factory Stores** (5 min um do outro).","Os 4 parques da Disney ficam aqui; ônibus gratuitos da Disney ligam Disney Springs aos hotéis Disney.","**Almoço com cupom:** o **Laçador Grill** (churrascaria brasileira por quilo, 15771 Kissimmee Vineland Rd, 11h30–16h) fica ao lado do Lake Buena Vista Factory Stores — a família indica almoçar lá e pedir o livro de cupons de desconto do outlet."]},{"id":"kissimmee-us-192-celebration","n":"Kissimmee · US-192 · Celebration","tag":"Sul","tagc":"sky","d":["**Old Town**: ruazinha com lojas, brinquedos e, aos sábados à noite, desfile de carros antigos — grátis.","**Celebration**: cidadezinha planejada pela Disney, bonita para caminhar e tomar café.","Muitos Walmart Supercenter, Ross e Target ao longo da 192; **The Loop** (Kissimmee) tem Kohl's, Ross, Ulta, Best Buy juntos."]},{"id":"sul-de-orlando-millenia-florida-mall","n":"Sul de Orlando (Millenia · Florida Mall)","tag":"Shoppings","tagc":"sky","d":["**Florida Mall**: maior shopping, com Primark, Macy's (com Backstage), Dillard's, JCPenney, H&M, Zara, Sephora. Simon Guest Services dá livro de cupons grátis.","**Mall at Millenia**: luxo (Louis Vuitton, Chanel, Apple, Bloomingdale's, Neiman Marcus). Bom para passear em dia de chuva."]},{"id":"centro-de-orlando-lake-eola","n":"Centro de Orlando · Lake Eola","tag":"Passeio","tagc":"sky","d":["**Lake Eola**: lago com fonte, cisnes e pedalinhos; feira aos domingos. Chega-se de SunRail (estação Church Street).","Restaurantes e bares em Church Street e Thornton Park."]},{"id":"bate-volta-12-h","n":"Bate-volta (1–2 h)","tag":"Passeios","tagc":"sky","d":["**Mount Dora** (45 min): cidadezinha de antiguidades e lago. **Cocoa Beach** (1 h): praia mais perto. **Kennedy Space Center** (1 h): centro espacial da NASA.","**St. Augustine** (2 h): cidade mais antiga dos EUA, estilo colonial espanhol. **Tampa** (1h30): Busch Gardens e aquário.","**De carro, em novembro:** St. Augustine (1h45) tem o **Nights of Lights** a partir de 21/11 — vale ir no fim da tarde e voltar à noite. Daytona (1h) tem o **Magic of Lights** de carro a partir de 20/11.","**Lançamento de foguete:** o Kennedy Space Center (≈1 h) tem lançamentos quase toda semana, mas as datas mudam muito. Veja o site/app do Kennedy Space Center na semana; praias como Playalinda e Jetty Park são boas para assistir de graça."]}]},{"grupo":"Centros de barganha (várias lojas de desconto no mesmo estacionamento)","itens":[{"id":"international-drive-value-center","n":"International Drive Value Center","tag":"I-Drive · ao lado do Premium Outlets","tagc":"sun","d":["Ross, T.J. Maxx, Five Below e Dollar Tree num lugar só (5295 International Dr). Combina com o dia do Orlando International Premium Outlets, que fica do outro lado da rua.","Faça o centro de manhã e o outlet depois do almoço."]},{"id":"vineland-pointe","n":"Vineland Pointe","tag":"Ao lado do Vineland Premium Outlets","tagc":"sun","d":["Ross, Burlington, Marshalls, Five Below, Sephora, Target e Aldi, com Chipotle e Panda Express para almoçar (Regency Village Dr / Daryl Carter Pkwy).","Perfeito para emendar com o Vineland outlet e o Lake Buena Vista Factory Stores no mesmo dia."]},{"id":"the-loop-e-the-loop-west","n":"The Loop e The Loop West","tag":"Kissimmee","tagc":"sun","d":["Dois centros, um de cada lado da avenida (Osceola Pkwy × John Young Pkwy): Nike Clearance Store, Kohl's, JCPenney, Michaels, Ross, Ulta, Best Buy e várias lojas de desconto.","Grande demais para fazer a pé: vá de carro/Uber de um lado para o outro."]},{"id":"the-crosslands","n":"The Crosslands","tag":"Kissimmee · ao lado do The Loop","tagc":"sun","d":["Marshalls & HomeGoods, Ross, Five Below, Dollar Tree e restaurantes (Centerview Blvd). Dá para fazer junto com o The Loop numa manhã.","Bom para quem vai à região da Disney/Kissimmee no mesmo dia."]}]},{"grupo":"Outlets e shoppings de Orlando","itens":[{"id":"orlando-international-premium-outlets","n":"Orlando International Premium Outlets","tag":"Simon · 4951 International Dr","tagc":"sun","d":["O maior e mais popular: Nike, adidas, Coach, Polo, Tommy, Calvin Klein, Columbia, Levi's, Character Warehouse (Disney).","**Livro de cupons VIP grátis:** vá ao **Simon Guest Services** e peça o \"VIP Coupon Book\"; mostre o app Simon (Simon+). Descontos extras em dezenas de lojas, por cima da promoção.","App **Simon** + **Simon+** (grátis): cupons digitais e cashback. Vá em dia de semana de manhã (10h–12h). ~30–40 min de Altamonte pela I-4."]},{"id":"orlando-vineland-premium-outlets","n":"Orlando Vineland Premium Outlets","tag":"Simon · 8200 Vineland Ave","tagc":"sun","d":["Mais chique: Gucci, Prada, Burberry, Tory Burch, Kate Spade, Michael Kors, Saks OFF 5TH, lululemon, Character Warehouse.","Mesmo livro de cupons VIP grátis no Guest Services (praça de alimentação ou Promenade) e app Simon+.","Perto da Disney (~45 min de Altamonte). Estacionamento difícil à tarde e no fim de semana."]},{"id":"lake-buena-vista-factory-stores","n":"Lake Buena Vista Factory Stores","tag":"15657 State Rd 535","tagc":"sky","d":["Menor e tranquilo: Old Navy Outlet, Carter's/OshKosh, Nike, Reebok, Gap, Tommy, Under Armour, Vans, The North Face.","Fica a 5 min do Vineland: dá para fazer os dois no mesmo dia.","Passe no **Welcome Center** na entrada e peça os cupons de desconto antes de começar.","Almoço: o Laçador Grill (brasileiro, por quilo) é vizinho — peça lá o livro de cupons do outlet."]},{"id":"the-florida-mall","n":"The Florida Mall","tag":"8001 S Orange Blossom Trl","tagc":"sky","d":["Maior shopping da região (Primark, Macy's Backstage, Dillard's, JCPenney, Zara, H&M, Sephora).","Simon Guest Services dá livro de cupons grátis também aqui. Praça de alimentação enorme com amostras grátis."]},{"id":"the-mall-at-millenia","n":"The Mall at Millenia","tag":"4200 Conroy Rd","tagc":"sky","d":["Shopping de luxo, bonito para passear. Preço cheio na maioria das lojas; Apple e Cheesecake Factory."]},{"id":"altamonte-mall","n":"Altamonte Mall","tag":"451 E Altamonte Dr","tagc":"sky","d":["O shopping da sua região: Macy's, JCPenney, Dillard's, Bath & Body Works, Victoria's Secret, Apple. Seg–Qui 11h–20h, Sex/Sáb 10h–21h, Dom 11h–19h."]}]},{"grupo":"Parques","itens":[{"id":"qual-parque-disney-em-cada-dia-multidao","n":"Qual parque Disney em cada dia (multidão)","tag":"Tabela da semana","tagc":"leaf","d":["Análise geral de multidões por dia da semana (fonte: @orlandocomavan). 🟢 muito bom (pouca fila) · 🔵 bom · 🟡 intermediário · 🔴 mais cheio. Feriados e eventos mudam tudo: confira as filas no app no dia.","Resumo: **quarta e quinta** são os melhores dias; **sábado** é o pior em todos. Domingo é bom no Magic Kingdom e no Hollywood Studios; terça, no EPCOT."]},{"id":"antes-de-qualquer-parque","n":"Antes de qualquer parque","tag":"Vale para todos","tagc":"leaf","d":["**Compre o ingresso antes**, no site oficial ou em agência brasileira conhecida. Nunca compre \"ingresso usado\" de pessoas na rua ou em anúncios — não funciona e é golpe.","Ingresso com data marcada: não precisa mais de reserva de parque na Disney. Chegue 45–60 min antes da abertura (\"rope drop\"): a primeira hora e meia tem as menores filas.","**Água gelada é grátis** em qualquer lanchonete (quick service): peça _\"a cup of ice water, please\"_. Leve garrafinha, boné, protetor e capa de chuva (chove à tarde).","Pessoas 60+ podem alugar **cadeira motorizada (ECV)** ou cadeira de rodas na entrada (pago; chegue cedo que acaba). Sentar-se nos shows e andar devagar ajuda muito no calor.","Não há desconto por idade na Disney/Universal; SeaWorld às vezes tem — pergunte. Estacionamento é pago (~US$ 30); Uber deixa na entrada.","Leve lanche e pequenas garrafas na bolsa: é permitido."]},{"id":"walt-disney-world","n":"Walt Disney World","tag":"4 parques","tagc":"sun","d":["**Magic Kingdom** (castelo, clássicos), **EPCOT** (países, comida), **Hollywood Studios** (Star Wars, Toy Story), **Animal Kingdom** (safári, Avatar).","Baixe o app **My Disney Experience**, crie conta e vincule o ingresso ANTES de viajar (precisa internet). Nele: mapa, filas em tempo real, Mobile Order (pedir comida sem fila) e Lightning Lane.","**Lightning Lane Multi Pass** (US$ 15–39 por pessoa/dia): fura fila em várias atrações; compra às 7h da manhã no dia. Vale se as filas estiverem acima de 60 min. **Single Pass** (US$ 12–25) é para 1–2 atrações top por parque.","Transporte Disney (ônibus, monotrilho, Skyliner, barcos) é **grátis** entre parques, Disney Springs e hotéis Disney.","Fogos: Magic Kingdom e EPCOT à noite. Chegue 40 min antes para pegar lugar."]},{"id":"universal-orlando","n":"Universal Orlando","tag":"3 parques","tagc":"sun","d":["**Universal Studios** (Harry Potter – Beco Diagonal, Simpsons), **Islands of Adventure** (Hogwarts, Marvel, Jurassic), **Epic Universe** (novo, 2025: Super Nintendo, Harry Potter Ministério, Dragões).","App **Universal Orlando**: mapa, filas e pedido de comida. **Express Pass** (fura-fila) é caro (US$ 100+); compensa só em dia cheio.","O trem Hogwarts Express liga os dois parques antigos — precisa ingresso \"park-to-park\".","**CityWalk** (restaurantes, lojas) é grátis para entrar; estacionamento fica grátis depois das 18h."]},{"id":"seaworld-aquatica-discovery-cove","n":"SeaWorld · Aquatica · Discovery Cove","tag":"I-Drive","tagc":"sky","d":["SeaWorld: orcas, golfinhos, aquários e montanhas-russas; mais tranquilo que Disney. Combos com Aquatica (parque aquático) e Busch Gardens (Tampa) saem mais baratos.","**Discovery Cove**: nado com golfinhos, tudo incluso (comida e bebida); precisa reservar o dia com antecedência.","Dá para chegar de I-Ride Trolley."]},{"id":"passeios-baratos-ou-gratis","n":"Passeios baratos ou grátis","tag":"Sem ingresso caro","tagc":"leaf","d":["**Disney Springs**, **CityWalk** e **Disney's BoardWalk**: grátis. **Gatorland** (~US$ 35): parque de jacarés, bem \"Flórida\". **Lake Eola** e **Winter Park** (barco pelos canais, ~US$ 20).","**ICON Park**: a roda-gigante é paga, mas a praça e os restaurantes são livres. **Old Town** (Kissimmee): grátis, sábado à noite tem carros antigos.","**Kennedy Space Center** (1 h): ingresso ~US$ 80, vale o dia inteiro."]}]},{"grupo":"Miami (uns dias)","itens":[{"id":"como-ir-e-voltar-trem-brightline","n":"Como ir e voltar: trem Brightline","tag":"MCO ↔ Miami","tagc":"leaf","d":["Trem rápido e confortável: sai da estação ao lado do **Terminal C do aeroporto de Orlando (MCO)** e chega na **MiamiCentral** (centro de Miami) em ~3h30, com paradas em West Palm Beach, Boca Raton, Fort Lauderdale e **Aventura** (colado no Aventura Mall!).","Compre com antecedência no app/site Brightline (a partir de ~US$ 54–79 no \"Smart\"; \"Premium\" tem lounge e comida). Chegue 20 min antes. Bagagem: 2 malas de mão + 2 despachadas.","De Altamonte ao MCO são ~35 min de Uber. Alternativa: ônibus (RedCoach, FlixBus) mais barato porém mais lento (4–5 h)."]},{"id":"sawgrass-mills-sunrise","n":"Sawgrass Mills (Sunrise)","tag":"Maior outlet dos EUA","tagc":"sun","d":["12801 W Sunrise Blvd, Sunrise — ~40 min do centro de Miami. Mais de 350 lojas, **fechado e com ar-condicionado**: Nike, Tommy, Polo, Gap, Marshalls, Target, Primark, Saks OFF 5TH, Disney Outlet, BrandsMart (eletrônicos) e a ala de luxo **Colonnade Outlets** (Gucci, Prada, Burberry).","**Livro de cupons grátis**: imprima/salve o voucher \"Boarding Pass for Savings\" do site do Sawgrass (ou mostre o app Simon) no **Simon Guest Services**.","Shuttle oficial sai de hotéis de Miami Beach e Downtown (pago, inclui livro de cupons). Use tênis: é enorme — faça uma ala por vez."]},{"id":"dolphin-mall","n":"Dolphin Mall","tag":"Outlet perto do aeroporto","tagc":"sun","d":["11401 NW 12th St, Miami (ao lado do aeroporto MIA). Outlets + Marshalls, Burlington, Ross, Saks OFF 5TH, Bloomingdale's Outlet, Polo, Nike, adidas. Menor e mais fácil que o Sawgrass.","Guest Services também tem cupons para turistas (pergunte: _\"Do you have a tourist coupon book?\"_)."]},{"id":"aventura-mall-bal-harbour","n":"Aventura Mall · Bal Harbour","tag":"Shoppings","tagc":"sky","d":["**Aventura Mall**: maior shopping da Flórida (Nordstrom, Macy's, Bloomingdale's, Apple, Zara, 300+ lojas). A estação **Aventura do Brightline** fica ao lado — dá para descer do trem direto.","**Bal Harbour Shops**: luxo (Chanel, Dior) — só para olhar e passear."]},{"id":"lincoln-road-bayside-brickell","n":"Lincoln Road · Bayside · Brickell","tag":"Passeio + compras","tagc":"sky","d":["**Lincoln Road** (South Beach): rua de pedestres com lojas, cafés e uma **Ross grande** e Marshalls perto (Collins Ave).","**Bayside Marketplace** (Downtown): lojinhas turísticas, passeio de barco pela baía (casas de famosos).","**Brickell City Centre**: shopping moderno; o **Metromover** (trenzinho elevado) é **grátis** e passa por Brickell e Downtown — bom para ver a cidade."]},{"id":"passeios-em-miami","n":"Passeios em Miami","tag":"O que ver","tagc":"sky","d":["**South Beach / Ocean Drive**: praia e prédios art déco (vá de manhã; à noite evite andar sozinha).","**Little Havana** (Calle Ocho): café cubano, Domino Park, lojas de charuto. **Wynwood Walls**: grafites (ingresso ~US$ 12).","**Vizcaya**: mansão com jardins à beira-mar (~US$ 25). **Everglades**: passeio de aerobarco com jacarés (1 h de Miami).","Imposto de venda em Miami: 7%. Uber funciona bem; gorjeta de 18–20% em restaurantes já vem na conta muitas vezes — confira para não pagar duas vezes."]}]}],"dicas":[{"id":"estrategia-para-20-dias","t":"Estratégia para 20 dias","icon":"compass","resumo":"Qual dia é bom para cada loja, roteiro de 3 dias e o que mais compensa trazer.","b":["**Segunda**: T.J. Maxx / Marshalls (10% 55+) e bealls. **Terça**: Ross (10% 55+); 1ª terça do mês, Walgreens 20%. **Quarta**: Kohl's (15% 60+) e remarcações novas na Ross/T.J. Maxx. **Quinta/sexta**: outlets (menos gente). **Fim de semana**: passeios, parques, Disney Springs — lojas lotam.","Faça uma região por dia (aba Lugares) para não cruzar a cidade. Perto da casa dá para resolver quase tudo em 1 km da SR-436.","Compre pesado/volumoso (panelas, mala, roupa de cama) no fim da viagem. Compre tênis e roupa cedo, para trocar se não servir.","O que mais compensa trazer: tênis, roupa de marca, cosméticos e perfumes (T.J. Maxx/Ross), vitaminas (Walgreens/CVS), panelas e utensílios (HomeGoods), eletrônicos (Best Buy — 110 V!), chocolates (Walmart/Target/Trader Joe's).","Leve uma mala vazia dentro da outra ou compre uma na Ross/T.J. Maxx/Burlington no começo da viagem (US$ 40–60) e vá enchendo.","**Roteiro pronto de 3 dias de compras:** Dia 1 — I-Drive: International Drive Value Center de manhã, Premium Outlets à tarde. Dia 2 — Vineland Premium Outlets, Vineland Pointe na saída e, se sobrar fôlego, Lake Buena Vista Factory Stores. Dia 3 — Florida Mall de manhã (Macy's, Primark, Apple), MacroBaby se precisar e Mall at Millenia à tarde. Extra: uma manhã em Kissimmee (The Loop, Loop West, The Crosslands). Para fechar: Disney Springs à noite, de graça.","**Melhores épocas do ano:** Black Friday até o Natal e as liquidações de janeiro. Em agosto há o \"tax holiday\" da Flórida (roupa e calçado até ~US$ 100 sem imposto) — não vale dentro dos parques."],"src":""},{"id":"do-mais-barato-ao-mais-caro","t":"Do mais barato ao mais caro","icon":"tag","resumo":"A ordem das lojas que faz o dinheiro render, e a lista do que não abre mão.","b":["**1º lojas de clearance** (Ross, T.J. Maxx, Marshalls, Burlington, Nike Clearance, Outlet Marketplace) → **2º lojas de departamento** (Macy’s, Kohl’s, JCPenney, com desconto de visitante e clearance no fundo) → **3º hipermercados** (Walmart, Target) → **4º outlets** (Premium Outlets, Lake Buena Vista) → **5º shoppings** (Florida Mall, Millenia).","Antes de sair, olhe a aba **Lista**: tenha claro o que não abre mão de comprar e em que loja achar, para não gastar o orçamento em outras coisas.","**O preço da etiqueta não é o final**: some o imposto no caixa (6,5% em Orlando, 7% em Altamonte, 7,5% em Kissimmee).","Converta antes de comprar: um preço baixo em dólar pode não compensar em reais com câmbio e IOF. Use o conversor da aba Hoje."],"src":"Fonte: @isaferreiravm (nov/2026)."},{"id":"gift-cards-do-banco-inter-cashback-em-dolar","t":"Gift cards do Banco Inter (cashback em dólar)","icon":"gift","resumo":"Como comprar os cartões no app do Inter e usar o código na loja física.","b":["No app do Inter, entre na **Global Account** (conta em dólar, grátis) → **Gift Cards** internacionais. Paga com saldo em dólar (ou cartão de crédito em dólar do Inter) e o cashback cai na hora, em dólar.","Lojas que costumam ter: Walmart, Target, T.J. Maxx/Marshalls/HomeGoods, CVS, Walgreens, Best Buy, Nike, Gap, Sephora, Ulta, Amazon, Apple, Uber, Disney. O cashback varia (3% a 17%; maior em Dia do Consumidor, 4 de Julho, Black Friday e \"Super 7\").","O gift card é um **código digital**: funciona na loja física. Tire print do código/QR. No caixa: _\"I am paying with a gift card.\"_ No autoatendimento, escolha \"Gift card\" e digite número + PIN.","Compre só o valor que vai usar: sobra não volta em dinheiro. Alguém da família no Brasil compra antes da viagem, nos dias de cashback alto, e manda os códigos."],"src":"Fontes: inter.co/gift-card, Melhores Cartões, Passageiro de Primeira (2024–2026)."},{"id":"apps-para-instalar-antes-de-viajar","t":"Apps para instalar antes de viajar","icon":"phone","resumo":"Tradutor e Maps offline, apps das lojas, Uber e Receita Federal.","b":["**Google Tradutor**: baixe o pacote offline Inglês ↔ Português. Modo **câmera** traduz etiquetas e placas; modo **conversa** fala com o caixa.","**Google Maps**: baixe mapas off-line de Orlando e Miami (Menu → Mapas off-line). Funciona sem chip.","**Uber**/**Lyft**: corrida com preço na tela. Compartilhe a viagem com a família (\"Share trip status\").","**Walmart**, **Target**, **Simon**, **myWalgreens**, **CVS**, **Kohl's**: cupons e scanner de preço. Grátis, só com e-mail.","**My Disney Experience** e **Universal Orlando**: ingressos, filas e comida. **Brightline**: passagens do trem.","**Viajantes** (Receita Federal): declaração e-DBV offline. **WhatsApp** com chip/eSIM internacional (Airalo, Holafly ou chip da operadora)."],"src":""},{"id":"transporte-em-orlando","t":"Transporte em Orlando","icon":"car","resumo":"Uber com preços aproximados, I-Ride Trolley, SunRail e transporte da Disney.","b":["**Uber/Lyft** é o mais prático. Preço aproximado: Altamonte ↔ outlets I-Drive US$ 30–45; ↔ Disney US$ 45–60; ↔ aeroporto US$ 40–55. Combine horários com o primo para as idas longas.","**I-Ride Trolley** (só na International Drive): liga os dois Premium Outlets, SeaWorld e ICON Park. US$ 2 por viagem; **65+ paga US$ 0,25**. Pague em dinheiro ao motorista.","**SunRail** (trem, dias úteis): Altamonte Springs → centro de Orlando (Church St) → Kissimmee. Barato (US$ 2–5), mas não vai a parques nem outlets.","**Lynx** (ônibus público): lento e confuso para turista; só em último caso. Linha 8 roda a I-Drive.","**Transporte da Disney** (ônibus, monotrilho, Skyliner, barcos) é grátis entre parques, hotéis Disney e Disney Springs.","Para o aeroporto no dia de voltar: Uber ou **Mears Connect** (van compartilhada, reserva online)."],"src":""},{"id":"black-friday-2026-fim-de-novembro","t":"Black Friday 2026 (fim de novembro)","icon":"sale","resumo":"Datas, ondas antecipadas, o que comprar cedo e como checar se o desconto é real.","b":["Datas: **Thanksgiving qui 26/11** · **Black Friday sex 27/11** · **Cyber Monday seg 30/11**. Lojas fecham ou abrem tarde no Thanksgiving; na sexta abrem de madrugada e lotam.","**As promoções começam antes:** Best Buy desde outubro, com preço de Black Friday já no começo/meio de novembro; Target faz a primeira onda na primeira semana cheia de novembro; Walmart roda rodadas no meio do mês e na semana da Black Friday (em 2025 foi 14–16/11 e 25–30/11).","**TV, eletrônico grande e brinquedo: compre na primeira onda.** O preço de início de novembro costuma empatar ou ganhar do preço da sexta, e o estoque acaba. Se bateu o preço que você queria, fecha; não espera.","**Confira se o desconto é real:** loja sobe o preço semanas antes para \"baixar\" na sexta. Sites CamelCamelCamel e Keepa mostram o histórico de preço de produtos da Amazon; use como referência.","**Guarde todas as notas:** na Target, se o preço da própria loja cair em até 14 dias, você recebe a diferença (só preço da Target, não de concorrente). Best Buy iguala concorrente listado, mas em geral não vale para \"doorbuster\" nem oferta relâmpago. Amazon não iguala preço de ninguém.","Na sexta, vale mais ir cedo às lojas de **off-price** (Ross, T.J. Maxx, Marshalls) e aos outlets, que fazem descontos extras sem a loucura das eletrônicas. Walmart e Target ficam caóticos: prefira o app."],"src":"Fontes: @acheiorlando (out/2026), políticas das lojas conferidas em 2026."},{"id":"o-que-comprar-onde-consulta-rapida","t":"O que comprar onde (consulta rápida)","icon":"map","resumo":"Tênis, perfume, casa, eletrônico, bebê, lembrancinha: a loja certa para cada coisa.","b":["**Tênis e roupa de esporte:** outlets (Nike, adidas, Under Armour), Nike Clearance Store (The Loop West), Dick's. **Roupa de marca e bolsas:** T.J. Maxx, Marshalls, Ross, Nordstrom Rack, Saks OFF 5TH.","**Perfume e maquiagem:** mais barato na T.J. Maxx/Marshalls/Ross (menos variedade); para testar tudo, Ulta e Sephora; Macy's com desconto de visitante.","**Casa e cozinha:** HomeGoods, T.J. Maxx, Target, Walmart (marcas caras: Crate & Barrel, Williams Sonoma no Millenia). **Malas:** Ross, T.J. Maxx, Marshalls, Burlington — compre no começo da viagem.","**Eletrônicos:** Best Buy (iguala preço), Walmart, Target; iPhone e Mac só na Apple Store. Fuja de quiosques e lojinhas de eletrônico de origem duvidosa.","**Vitaminas e remédios:** mais baratos no Walmart e no Target; CVS/Walgreens com cupom do app. **Brinquedos:** Target (organizado), Walmart, LEGO Store (Disney Springs).","**Bebê:** MacroBaby (português), comparando com Target, Walmart e Carter's. **Papelaria:** Target, Walmart, Staples, Office Depot. **Artesanato e festa:** Michaels (10% 55+), Hobby Lobby.","**Lembrancinhas:** Target, Walmart, Character Warehouse, Five Below, Dollar Tree; Disney Springs para passear. **Mercado:** Publix (BOGO), Aldi, Walmart, Trader Joe's."],"src":""},{"id":"iphone-celular-e-eletronicos","t":"iPhone, celular e eletrônicos","icon":"device","resumo":"Apple Store, Trade In, iPhone americano só com eSIM, garantia e cota.","b":["Apple Store em Orlando: **Mall at Millenia** e **Florida Mall**. Preço é o mesmo em qualquer Apple Store (mais 6,5% de imposto no caixa). Reserve no site/app da Apple e marque retirada na loja para garantir modelo, cor e memória.","**Apple Trade In:** dá para entregar o aparelho usado como parte do pagamento. Antes: backup, desligar o Buscar (Find My) e sair da conta Apple; leve o passaporte. O valor é avaliado na hora e pode mudar; pergunte se aceitam modelo comprado no Brasil.","**iPhone vendido nos EUA é só eSIM** (sem chip físico): confirme que a operadora no Brasil aceita eSIM antes de comprar.","A garantia americana pode não ser aceita no Brasil. Eletrônico entra na cota de US$ 1.000 — guarde a nota. Atenção à voltagem (110 V) em eletrodomésticos.","Best Buy: peça para igualar preço da Amazon/Walmart mostrando no celular; produtos \"Open-Box\" saem 10–30% mais baratos com garantia."],"src":"Fontes: Apple (Trade In), Receita Federal, guia Colheita de Milhas 2026."},{"id":"como-ler-etiquetas-e-achar-liquidacao","t":"Como ler etiquetas e achar liquidação","icon":"tag","resumo":"Cores de etiqueta, melhores dias, palavras que importam e a pergunta que vale 10%.","b":["**T.J. Maxx / Marshalls / HomeGoods:** vermelha = liquidação; **amarela = preço final** (pegue na hora).","**Ross:** preço riscado com valor novo menor; remarcações na terça à noite → quarta de manhã.","**Target:** etiqueta vermelha com % no canto (30, 50, 70%) nas pontas de corredor. **Walmart:** amarela \"Rollback\"/\"Clearance\"; o app mostra se está ainda mais barato.","**Kohl's / JCPenney / Macy's:** araras \"Clearance\" no fundo, etiqueta amarela/vermelha; cupons do app somam.","Palavras: **Sale** = promoção · **Clearance** = liquidação · **Final sale** = sem devolução · **BOGO** = leve 2 pague 1 · **Buy 2 get 1 free** = leve 3 pague 2 · **Extra 20% off** = 20% a mais sobre a etiqueta.","**Sempre pergunte**: _\"Any discounts or coupons today?\"_ Muitas lojas dão 10–15% só porque pediu.","Nas lojas de clearance é garimpo: **confira costuras, zíperes e manchas** (algumas peças têm defeito pequeno) e, se gostou, **compre na hora** — o estoque muda toda semana e não volta."],"src":""},{"id":"duo-gourmet-2-pratos-pelo-preco-de-1","t":"Duo Gourmet: 2 pratos pelo preço de 1","icon":"fork","resumo":"Como usar o app nos restaurantes parceiros de Orlando e Miami.","b":["App brasileiro (assinatura anual ~R$ 708; promoções com o Inter dão meses grátis). Em restaurantes parceiros você pede **2 pratos principais e paga só 1** (o de maior valor).","Funciona em **Orlando, Miami e Tampa**. Exemplo em Orlando: Boi Brazil Churrascaria. A lista muda: abra o app, filtre por cidade e veja os parceiros perto.","É 2 por 1, então é para ir acompanhada. Avise o garçom **antes de pedir** e mostre o app: _\"We are using Duo Gourmet.\"_ Não inclui bebida nem sobremesa; alguns limitam dias.","Assinatura deve ser feita no Brasil, antes da viagem (cartão brasileiro)."],"src":"Fontes: blog.duogourmet.com.br, Melhores Destinos (ago/2026)."},{"id":"dinheiro-imposto-e-pagamento","t":"Dinheiro, imposto e pagamento","icon":"dollar","resumo":"Imposto por cidade, pagar sempre em dólar, gorjeta e notas fiscais.","b":["**Sales tax**: o preço da etiqueta NÃO inclui imposto. Altamonte Springs e Miami ~7%; Orlando/I-Drive/Disney (Orange) 6,5%; Kissimmee (Osceola) 7,5%. Não há devolução de imposto para turista na Flórida.","**Pague em dólar, nunca em reais:** se a maquininha ou o caixa perguntar se quer cobrar em reais (BRL), responda **\"US dollars, please\"**. A conversão da loja é bem pior que a do seu banco.","Pague com cartão sempre que puder (aproximação funciona quase em toda parte, menos no Walmart). Leve um pouco de dinheiro para gorjeta, I-Ride e mercado pequeno.","Maquininha pergunta **\"Credit or debit?\"** → responda **\"Credit\"**. Se pedir CEP (_zip code_) em bomba de gasolina, vá ao caixa humano.","Gorjeta (_tip_) de 15–20% em restaurante é esperada; em Miami muitas vezes já vem na conta (_service charge_) — confira antes de dar outra.","Guarde todas as notas (_receipts_): devolução e alfândega."],"src":""},{"id":"volta-ao-brasil-cota-de-us-1-000-e-e-dbv","t":"Volta ao Brasil: cota de US$ 1.000 e e-DBV","icon":"customs","resumo":"Cota de US$ 1.000, o que não conta e como declarar se passar.","b":["Cota de isenção por avião: **US$ 1.000** por pessoa em bens tributáveis (roupas, calçados, eletrônicos, perfumes, presentes). Acima disso, **50%** sobre o que exceder.","Não entram na cota: itens de uso pessoal compatíveis com a viagem (roupa que ela usou, celular, remédios), livros e revistas.","Se passar, preencha a **e-DBV** (site da Receita ou app **Viajantes**) antes de desembarcar e vá pelo canal \"Bens a declarar\". Dá para preencher no avião e enviar quando tiver internet.","Free shop na chegada ao Brasil tem cota extra de US$ 1.000, separada. Use a aba **Lista** para somar as compras."],"src":"Fonte: Receita Federal (regras conferidas em 2026)."},{"id":"dois-passaportes-brasil-e-portugal","t":"Dois passaportes (Brasil e Portugal)","icon":"passport","resumo":"Qual passaporte usar em cada etapa e o que responder na imigração.","b":["Nos EUA, use **o mesmo passaporte na entrada e na saída**. Com o português, precisa de **ESTA** aprovado antes do embarque (válido 2 anos; só no site oficial esta.cbp.dhs.gov). Com o brasileiro, visto americano válido.","No Brasil, brasileiro deve **entrar e sair com o passaporte brasileiro**. Leve os dois na bagagem de mão.","Na imigração americana, responda curto: _\"Tourism. Visiting family in Altamonte Springs.\"_ Leve impresso o endereço do primo e o voo de volta."],"src":""},{"id":"saude-e-seguranca","t":"Saúde e segurança","icon":"health","resumo":"911, nomes dos remédios em inglês, seguro e cuidados na rua.","b":["Emergência: **911**. Diga: _\"Ambulance, please. I speak Portuguese.\"_","Remédio sem receita em CVS/Walgreens/Walmart. Nomes: paracetamol = **acetaminophen (Tylenol)**; ibuprofeno = **ibuprofen (Advil)**; antialérgico = **loratadine (Claritin)**; azia = **Tums**; dipirona não existe nos EUA.","Remédios de uso contínuo: caixa original + receita com o nome do princípio ativo.","Seguro-viagem: número no celular e no papel. Hospital sem seguro é muito caro.","Bolsa na frente do corpo em lugares cheios; não deixe sacolas visíveis no carro; em Miami, evite andar sozinha à noite fora das áreas movimentadas."],"src":""},{"id":"aniversario-na-viagem","t":"Aniversário na viagem","icon":"gift","resumo":"Broche grátis da Disney e o que ele pode render nos parques.","b":["Na Disney, peça o **broche “Happy Birthday”** grátis no Guest Relations, nas bilheterias ou em lojas dos parques (no EPCOT, por exemplo). O funcionário escreve o nome. Também dá para pegar no Disney Springs ou na recepção de um hotel Disney.","Pegue o broche **logo na chegada** e use o dia todo: funcionários e personagens dão parabéns, e às vezes restaurantes oferecem uma sobremesa ou um mimo.","São surpresas possíveis, **não garantidas**: depende da equipe do dia.","Diga: _\"It's my birthday today!\"_ — eles adoram."],"src":"Fonte: Disney (programa de comemorações), conferido em 2026."}],"pontos":{"regioes":[{"g":"Orlando","id":"alt","n":"Altamonte Springs (casa)","la":28.661,"lo":-81.39,"al":["altamonte","casa","fern park","maitland"]},{"g":"Orlando","id":"wp","n":"Winter Park","la":28.598,"lo":-81.351,"al":["park ave","park avenue","winter park"]},{"g":"Orlando","id":"idr","n":"International Drive / Universal","la":28.465,"lo":-81.455,"al":["citywalk","epic universe","i-drive","icon park","international drive","marketplace","outlet marketplace","premium outlets international","seaworld","universal","value center"]},{"g":"Orlando","id":"mil","n":"Millenia / Florida Mall","la":28.47,"lo":-81.41,"al":["florida mall","macrobaby","mall at millenia","millenia"]},{"g":"Orlando","id":"lbv","n":"Lake Buena Vista / Disney / Vineland","la":28.385,"lo":-81.49,"al":["animal kingdom","disney","disney springs","epcot","hollywood studios","lake buena vista","laçador","lbv","magic kingdom","premium outlets vineland","vineland"]},{"g":"Orlando","id":"kis","n":"Kissimmee / US-192 / The Loop","la":28.33,"lo":-81.44,"al":["192","celebration","crosslands","kissimmee","loop west","old town","the loop"]},{"g":"Orlando","id":"dt","n":"Centro de Orlando","la":28.542,"lo":-81.379,"al":["centro","church street","downtown orlando","farmers market","feira","kia center","lake eola","orlando magic"]},{"g":"Miami","id":"mdt","n":"Miami — Downtown / Brickell","la":25.772,"lo":-80.193,"al":["bayside","brickell","downtown miami","miamicentral"]},{"g":"Miami","id":"mb","n":"Miami Beach / South Beach","la":25.785,"lo":-80.135,"al":["lincoln road","miami beach","ocean drive","south beach"]},{"g":"Miami","id":"mid","n":"Midtown / Wynwood","la":25.805,"lo":-80.195,"al":["midtown miami","wynwood"]},{"g":"Miami","id":"ave","n":"Aventura / North Miami Beach","la":25.955,"lo":-80.143,"al":["aventura","aventura mall","bal harbour","north miami beach"]},{"g":"Miami","id":"dor","n":"Doral / Dolphin Mall","la":25.79,"lo":-80.35,"al":["aeroporto de miami","d
